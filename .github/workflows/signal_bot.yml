name: VÀNG Đánh BTC Signal Bot

on:
  # Chạy tự động mỗi 15 phút (khung nến M15)
  schedule:
    - cron: '*/15 * * * *'
  
  # Cho phép bấm nút "Run workflow" hoặc gọi từ webhook ngoài (cron-job.org)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-signal-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kéo mã nguồn từ Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 🐍 Cài đặt môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: ⚡ Cache Hugging Face Model Weights (Kronos-base)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-kronos-base-weights-v1

      - name: 📦 Cài đặt PyTorch CPU & các thư viện AI
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: 🚀 Chạy mô hình KRONOS-BASE phân tích nến (BTC M15 & Vàng 1H)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_VERBOSITY: error
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '9193848531:AAGphQqE0tP_SGxiiBMRUaZUL0umU_L14yY' }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || '-1002144845536' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python main.py --once

      - name: 💾 Lưu lại lịch sử tín hiệu TP/SL vào Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f signals_history.json ]; then
            git add signals_history.json
            git commit -m "chore: lưu lịch sử tín hiệu và trạng thái TP/SL [skip ci]" || echo "Không có thay đổi lịch sử"
            git push origin main || echo "Không thể push hoặc đã là mới nhất"
          fi
