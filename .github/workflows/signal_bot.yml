name: VÀNG Đánh BTC Signal Bot

on:
  # Chạy tự động mỗi 15 phút (Đã đóng lại vì dùng cron-job.org gọi chuẩn xác qua API để tránh trùng lặp)
  # schedule:
  #   - cron: '*/15 * * * *'
  
  # Cho phép bấm nút "Run workflow" hoặc gọi tự động từ webhook ngoài (cron-job.org)
  workflow_dispatch:
    inputs:
      action:
        description: 'Chọn chế độ chạy:'
        required: true
        default: 'once'
        type: choice
        options:
          - 'once'        # Quét nến bình thường (mặc định)
          - 'report'      # Gửi ngay Báo cáo ngày hôm qua
          - 'report-week' # Gửi ngay Báo cáo tổng kết tuần
          - 'force'       # Ép buộc gửi ảnh biểu đồ kể cả lúc Sideway
          - 'test'        # Thử nghiệm kết nối Telegram

permissions:
  contents: write

jobs:
  run-signal-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kéo mã nguồn từ Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 🐍 Cài đặt môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: ⚡ Cache Hugging Face Model Weights (Kronos-base)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-kronos-base-weights-v1

      - name: 📦 Cài đặt PyTorch CPU & các thư viện AI
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: 🚀 Chạy bot theo chế độ được chọn
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_VERBOSITY: error
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          ACTION="${{ github.event.inputs.action }}"
          if [ "$ACTION" = "report" ]; then
            echo "📊 Chạy báo cáo hiệu suất ngày hôm qua..."
            python main.py --report
          elif [ "$ACTION" = "report-week" ]; then
            echo "🏆 Chạy báo cáo tổng kết tuần..."
            python main.py --report-week
          elif [ "$ACTION" = "force" ]; then
            echo "⚡ Ép buộc gửi ảnh biểu đồ phân tích..."
            python main.py --once --force
          elif [ "$ACTION" = "test" ]; then
            echo "🔔 Kiểm tra bot Telegram..."
            python main.py --test
          else
            echo "🤖 Chế độ quét nến tự động..."
            python main.py --once
          fi

      - name: 💾 Lưu lại lịch sử tín hiệu TP/SL vào Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f signals_history.json ]; then
            git add signals_history.json
            git commit -m "chore: lưu lịch sử tín hiệu và trạng thái TP/SL [skip ci]" || echo "Không có thay đổi lịch sử"
            git push origin main || echo "Không thể push hoặc đã là mới nhất"
          fi
